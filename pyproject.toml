[project]
name = "pie"
version = "0.0.3"
description = "极简 agent harness：内置 read / edit / write / shell 四个工具，YOLO 模式"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
    "textual>=0.60",
]

[project.scripts]
pie = "pie.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

