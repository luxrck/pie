[package]
name = "pie"
version = "0.1.0"
edition = "2024"
description = "pi 的 Rust 实现：极简 agent harness（YOLO——无权限确认、无沙箱；内置 read/edit/writ/bash）"
license = "MIT"

[workspace]
# `bindings/` 是 Python 绑定（自己的 workspace）：它要 `pie` 的 **lib**（`default-features = false`），
# 不能被卷进本 workspace 的“默认成员”里（否则 `cargo test` 会连带去建 cdylib、要 Python 环境）。
# （上一版 `#[tool]` 属性宏的遗留 `macros/` 已于 2026-09-23 删除。）
exclude = ["bindings"]

# `pie` 现在同时是 lib（外部 / 绑定用）与 bin（CLI）。
# lib 名 `pie`：bin 里 `use pie::…`；绑定侧直接用这个 crate（2026-09-23 由 `pie_rs` 改名）。
[lib]
name = "pie"
path = "src/lib.rs"

# CLI 需要 clap（`cli`）与 TUI（`tui`）两个 feature；`--no-default-features` 时干脆不建 bin。
[[bin]]
name = "pie"
path = "src/main.rs"
required-features = ["cli", "tui"]

[features]
default = ["cli", "tui"]
# CLI 参数解析（只有 bin 用；绑定不需要 → 不进依赖图）
cli = ["dep:clap"]
# TUI 及其一切实现依赖（绑定**绝不**开这个 feature）
tui = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:ratatui-textarea",
    "dep:tui-markdown",
    "dep:arboard",
    "dep:unicode-width",
    "dep:unicode-segmentation",
    "dep:ignore",
    "dep:catppuccin",
    "dep:ratatui-image",
]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "time", "signal", "sync"] }
# TLS 用 rustls（provider = ring），不用 native-tls/OpenSSL：
#   - 不依赖系统的 libssl-dev / pkg-config，跨平台行为一致；
#   - 0.13 起 `rustls-tls` 改名 `rustls`，而 `rustls` 默认带 aws-lc-rs（一大坨 C 构建，跨平台要 cmake/NASM）
#     → 我们走 `rustls-no-provider`，自己把 provider 钉回 ring（见下面那行 rustls + llm.rs 的 install_default）；
#   - 信任根走 0.13 默认的 rustls-platform-verifier（macOS = Keychain，认系统里装的企业 CA）；
#     ⚠ 0.12 的 native-roots 那条路（认 `SSL_CERT_FILE` / `SSL_CERT_DIR`）不再生效——要它得自己 tls_certs_only。
#   - `query` 在 0.13 里变成默认关闭的 feature（`.query()` 要用到）。
# default-features = false 很关键：否则会同时拉进 native-tls(OpenSSL)。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "multipart",
    "query",
    "rustls-no-provider",
] }
# 只为把 crypto provider 钉成 ring（reqwest 0.13 默认 aws-lc-rs）；装它的那一行在 `llm.rs::LlmClient::new`。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 工具的参数 schema 由结构体 + doc 注释自动派生（替代之前那个手写 JSON / 自己写 derive 的方案）。
# 1.x：`SchemaSettings` 搬进了 `schemars::generate`，且不再有 `option_add_null_type` 开关
# （`Option<T>` 一律写成 `"type": [.., "null"]`）→ 归一那步见 `tools.rs::strip_schema_noise`。
schemars = "1"
# 图片识别（魔数 + 只读头部拿尺寸）：用 image 而不是手写解析。
# 不开默认特性（省掉 rayon/avif/exr/tiff…），只要读的那五种格式。
# 将来 clipboard 模块也要靠它把 raw RGBA 编码成 PNG（Python 那边是 Pillow 干的）。
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
toml = "0.9"
clap = { version = "4", features = ["derive"], optional = true }
futures-util = "0.3"
# shell 工具要 dup2 合并 stderr + killpg 杀进程组（std 不暴露这两个）
libc = "0.2"
sha2 = "0.11"
hex = "0.4"
# 以下 6 个都是 **TUI 专用**（`tui` feature）：绑定侧 `default-features = false` → 不进依赖图。
#
# ratatui 0.30（widget/backend 已拆成 ratatui-core / ratatui-widgets，facade 仍是 `ratatui`）。
# 滚动偏移不再靠 `Paragraph::line_count`（那个 feature 已不需要）：消息流由 `history::layout`
# 自己折行，显示行数就是 `rows.len()`。
ratatui = { version = "0.30", optional = true }
# `event-stream` 才给 `EventStream`（与 tokio select! 搭配用）；默认 features 里没有它。
# 0.29：ratatui 0.30 的 crossterm backend（ratatui-crossterm 默认开 crossterm_0_29）与
# ratatui-textarea 都用它 → 全树只有一个 crossterm，事件类型才对得上。
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
# 输入框：官方接手 tui-textarea 后的 crate（github.com/ratatui/ratatui-textarea）。老的
# tui-textarea 0.7 已停更且**没有软换行**；0.9 起有 `set_wrap_mode`（长行不再水平滚动）。
ratatui-textarea = { version = "0.9", optional = true }
# 自己折行（pane.rs）算字符显示宽度：与 ratatui 内部同一份 unicode-width（已是其传递依赖）。
unicode-width = { version = "0.2", optional = true }
# 折行的**分词**（UAX#29 词边界）：只给 `WrapMode::WordOrGlyph` 档用（`pane::wrap_segments`，
# 规则对齐 `ratatui-textarea` 的 `wrap_word_chunks`）；输入框固定逐字断、不用它。
# 它本来就在这棵树里（`ratatui-textarea` 等依赖它），这里只是显式声明。
unicode-segmentation = { version = "1", optional = true }
# 剪贴板：粘贴文本 / 图片路径（图片本体走 session::store_blob）
arboard = { version = "3", optional = true }
# `@` 文件路径补全要按 `.gitignore` 扫目录：直接用 ripgrep 那套（嵌套 .gitignore、`!` 取反、
# `/` 锚定…都齐了，手写 glob 想复刻这些很容易漏）。纯 Rust、无 C 依赖。
ignore = { version = "0.4", optional = true }
# markdown → ratatui Text。0.3.7+ 已迁到 ratatui 0.30 的 `ratatui-core`，与上面配套。
# 开默认特性 `highlight-code`：代码块用 syntect 做语法高亮。⚠ 它的 syntect 依赖是**默认特性**
# （`default-onig`）→ 会拉 oniguruma（C 库，靠 `cc` 编译）与 syntect 的语法/主题数据（几 MB）；
# 这是**有意接受**的代价（换成自写高亮就能去掉，见 docs/CHANGELOG.md）。
tui-markdown = { version = "0.3.10", optional = true }
# 内置配色取自 Catppuccin 官方色板（`theme.rs` 里那套手写 RGB 本来就是「近似 Mocha」）。
# 开 `ratatui` feature 才有 `impl From<catppuccin::Color> for ratatui_core::style::Color`
# —— 它只多一条已经在树里的 ratatui-core 边（两边都是 0.1.x，类型是同一份），不引别的依赖。
catppuccin = { version = "2.8", features = ["ratatui"], optional = true }
# TUI 里显示 `repl` 生成的图（matplotlib）：一份 API 覆盖 kitty / iTerm2 / sixel / halfblocks 四档。
# ⚠ 默认特性带 `chafa-dyn`（要 pkg-config + libchafa C 库）→ 关掉；`image` 直接用树里那份（只开
# png/jpeg/gif/webp/bmp），`crossterm` 同理。走哪一档在 `tui::pick_terminal_protocol` 里按
# **环境变量**定——故意不用 `from_query_stdio`，原因见那儿的注释。
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"], optional = true }

[profile.release]
opt-level = 2
