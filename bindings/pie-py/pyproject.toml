[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pie"
version = "0.1.0"
description = "pie（Rust 版 agent harness）的 Python 绑定"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# 扩展模块装在 `pie` 包里（`pie/_pie_rs.*.so`）：外壳包负责 re-export 与类型存根。
python-source = "python"
module-name = "pie._pie_rs"
