[package]
name = "pie-macros"
version = "0.1.0"
edition = "2021"
description = "pie-rs 的 #[tool] 属性宏：让工具定义长得像 Python 版的 @tool(...) 装饰器"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "parsing", "printing", "proc-macro", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
serde_json = "1"
